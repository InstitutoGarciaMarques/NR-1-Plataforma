<style>
:root{--navy:#0b1730;--navy2:#13244a;--gold:#c9a24a;--paper:#f6f4ee;--card:#fff;--ink:#1b2236;--muted:#6b7488;--line:#e3dfd3;
--lv1:#d9f0df;--lv1t:#1d6b3a;--lv2:#fbf0c6;--lv2t:#7a5b00;--lv3:#fcd9b6;--lv3t:#9a4a00;--lv4:#f6c3c3;--lv4t:#9b1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Cormorant Garamond',serif;margin:.2em 0 .4em;color:var(--navy)}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}
.top{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand small{display:block;font-family:'Cormorant Garamond',serif;font-size:.7rem;letter-spacing:.25em;color:var(--gold)}
.brand b{font-family:'Cormorant Garamond',serif;font-size:1.15rem;letter-spacing:.12em}
.right{display:flex;align-items:center;gap:10px;font-size:.85rem}
.tabs{background:var(--navy2);display:flex;gap:2px;overflow-x:auto;padding:0 12px}
.tabs button{background:none;border:0;color:#cfd6ea;padding:12px 16px;cursor:pointer;font:500 .9rem Inter;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-color:var(--gold)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.narrow{max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cfcab9;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:9px 16px;cursor:pointer;font:600 .88rem Inter}
.btn.gold{background:var(--gold);color:#1a1405}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 12px}
.btn.line{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#efeadb;border-radius:20px;padding:3px 10px;font-size:.8rem;margin:2px 4px 2px 0}
.chip button{border:0;background:none;cursor:pointer;color:#8a2020;font-size:1rem;line-height:1;padding:0}
.code{font-family:'IBM Plex Mono',monospace;background:#efeadb;padding:2px 8px;border-radius:5px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mx td.lv{text-align:center;cursor:pointer;font-weight:600}
.mx td.lv small{display:block;font-weight:500;font-size:.68rem}
.lv1{background:var(--lv1);color:var(--lv1t)}.lv2{background:var(--lv2);color:var(--lv2t)}.lv3{background:var(--lv3);color:var(--lv3t)}.lv4{background:var(--lv4);color:var(--lv4t)}
.badge{display:inline-block;border-radius:5px;padding:1px 8px;font-size:.75rem;font-weight:600}
.scroll{overflow-x:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-size:.9rem}
.toast.err{background:#8a1f1f}
.tabsel{display:flex;gap:8px;margin-bottom:14px}
.tabsel button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font:600 .9rem Inter}
.tabsel button.on{background:var(--navy);color:#fff}
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q p{margin:0 0 10px;font-weight:500}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale button{border:1px solid #cfcab9;background:#fff;border-radius:8px;padding:8px 4px;font:500 .72rem Inter;cursor:pointer;color:var(--ink)}
.scale button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.prog{height:8px;background:#e8e3d3;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.pcard{cursor:pointer;transition:.15s}.pcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.aula{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.aula:hover{background:#faf8f1}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid #cfcab9;flex:none;display:grid;place-items:center;font-size:.7rem;color:#fff}
.ck.on{background:var(--lv1t);border-color:var(--lv1t)}
.video{position:relative;padding-top:56.25%;margin:12px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}
.lesson{white-space:pre-wrap;font-size:1.02rem}
.rep h1{font-size:1.7rem}.rep h2{font-size:1.2rem;margin-top:1.4em}
.logobox{background:#000;border-radius:8px;padding:10px 16px;display:inline-block;margin-bottom:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}.sign div{border-top:1px solid #333;padding-top:6px;font-size:.8rem}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
@media(max-width:600px){.scale button{font-size:.62rem;padding:7px 2px}}
@media print{.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.tabs,.noprint,.toast{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.card{border:0;padding:0}}
</style>
</head>

/* ============ PESQUISA ANÔNIMA (colaborador) ============ */
const R={token:null,info:null,setor:null,ans:{},page:0,per:6};
const ESCALA=[[1,'Discordo totalmente'],[2,'Discordo'],[3,'Neutro'],[4,'Concordo'],[5,'Concordo totalmente'],[0,'Não se aplica']];
async function startRespondent(token){
  R.token=token;
  app.innerHTML=header()+`<main class="wrap narrow"><p class="muted">Carregando…</p></main>`;
  const {data,error}=await sb.rpc('nr1_info_campanha',{p_token:token});
  if(error||!data||data.erro){
    const enc=data&&data.erro==='encerrada';
    app.innerHTML=header()+`<main class="wrap narrow"><div class="card"><h2>${enc?'Pesquisa encerrada':'Link inválido'}</h2><p class="muted">${enc?'Esta pesquisa não está mais recebendo respostas.':'Confira o link recebido com o responsável da sua empresa.'}</p></div></main>`;return;
  }
  R.info=data;R.ans={};R.page=0;R.setor=null;
  if(lsGet('nr1_done_'+token)) return respDone(true);
  respIntro();
}
function respIntro(){
  const i=R.info;
  app.innerHTML=header()+`<main class="wrap narrow"><div class="card">
  <div class="logobox">${logo(56)}</div><h1>${esc(i.nome)}</h1><p class="muted">${esc(i.empresa)}</p>
  <p>Esta pesquisa busca entender como o <b>trabalho é organizado</b> na sua empresa (carga, autonomia, apoio, relações, comunicação, entre outros aspectos), para que a empresa possa prevenir riscos à saúde e ao bem-estar de todos.</p>
  <p><b>Sua resposta é anônima.</b> Não pedimos nome, CPF, e-mail nem qualquer dado que identifique você. Os resultados são analisados de forma <b>coletiva</b>, por setor, e grupos com poucas respostas não são exibidos. Não se trata de avaliação individual nem de diagnóstico de saúde.</p>
  <p class="muted">Tempo estimado: 8 a 10 minutos. Responda pensando nos últimos meses e com sinceridade; não há resposta certa ou errada.</p>
  <label>Em qual setor/área você trabalha?</label>
  <select id="setor" onchange="R.setor=this.value;$('#go').disabled=!R.setor"><option value="">Selecione…</option>${i.setores.map(s=>`<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('')}</select>
  <p><button class="btn gold" id="go" disabled onclick="respPage()">Começar</button></p></div></main>`;
}
function respPage(){
  const P=R.info.perguntas,per=R.per,tot=Math.ceil(P.length/per),sl=P.slice(R.page*per,R.page*per+per);
  app.innerHTML=header()+`<main class="wrap narrow"><div class="card">
  <div class="row"><span class="muted">Parte ${R.page+1} de ${tot}</span><span class="muted">${Object.keys(R.ans).length}/${P.length} respondidas</span></div>
  <div class="prog" style="margin:8px 0 6px"><i style="width:${Math.round(Object.keys(R.ans).length/P.length*100)}%"></i></div>
  ${sl.map((p,k)=>`<div class="q" id="q${p.id}"><p>${R.page*per+k+1}. ${esc(p.texto)}</p><div class="scale">${ESCALA.map(([v,l])=>`<button data-v="${v}" class="${R.ans[p.id]===v?'on':''}" onclick="pick(${p.id},${v})">${l}</button>`).join('')}</div></div>`).join('')}
  <div class="row" style="margin-top:16px"><button class="btn line" onclick="respBack()">Voltar</button><button class="btn gold" id="nx" onclick="respNext()"></button></div></div></main>`;
  updNext();window.scrollTo(0,0);
}
function pick(id,v){R.ans[id]=v;document.querySelectorAll('#q'+id+' button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v));updNext()}
function updNext(){
  const P=R.info.perguntas,sl=P.slice(R.page*R.per,R.page*R.per+R.per),last=(R.page+1)*R.per>=P.length;
  const ok=sl.every(p=>R.ans[p.id]!==undefined);const b=$('#nx');if(!b)return;
  b.textContent=last?'Enviar respostas':'Continuar';b.disabled=!ok;
}
function respBack(){if(R.page===0)return respIntro();R.page--;respPage()}
async function respNext(){
  const P=R.info.perguntas;
  if((R.page+1)*R.per<P.length){R.page++;return respPage()}
  const b=$('#nx');b.disabled=true;b.textContent='Enviando…';
  const {error}=await sb.rpc('nr1_enviar_resposta',{p_token:R.token,p_setor:R.setor,p_respostas:R.ans});
  if(error){toast(ERRS[error.message]||'Não foi possível enviar. Tente novamente.',true);b.disabled=false;b.textContent='Enviar respostas';return}
  lsSet('nr1_done_'+R.token,'1');respDone(false);
}
function respDone(again){
  app.innerHTML=header()+`<main class="wrap narrow"><div class="card"><h2>${again?'Resposta já registrada neste dispositivo':'Obrigado pela sua participação!'}</h2>
  <p>${again?'Para manter a pesquisa confiável, cada pessoa responde uma única vez.':'Sua resposta foi registrada de forma anônima e será analisada junto com a do seu setor.'}</p>
  ${again?`<p class="muted">Outra pessoa vai responder neste mesmo aparelho? <a href="#" onclick="event.preventDefault();respIntro()">Iniciar nova resposta</a></p>`:''}</div></main>`;
}

/* ============ LOGIN / CADASTRO ============ */
let USER=null,ME=null,VIEW=null;
async function startAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return renderLogin('in');

async function doAuth(e,mode){

  renderLogin('in','Conta criada. Confirme o e-mail enviado para você e depois faça o login.');
}

  ${m.grupos.map(g=>`<tr><td>${esc(nome(g.setor_id))}</td><td>${g.n}</td><td>${g.media}</td><td>${g.pct}%</td><td>${g.prob}</td><td>${m.severidade}</td><td>${g.score}</td><td>${lvBadge(g.nivel)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Sem dados suficientes.</td></tr>'}</tbody></table></div>

function recHtml(m){
  const worst=Math.max(0,...m.grupos.map(g=>g.score));

  return `<div style="margin-top:14px"><b>Programas recomendados${worst>=4?'':' (nível atual baixo: manutenção)'}</b>${ts.map(t=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(t.titulo)} <span class="muted">· ${t.categoria==='servico'?'serviço com psicólogo(a)':'curso'}</span></span>${isInst()?`<button class="btn sm line noprint" onclick="addRec('${t.id}','${m.codigo}')">Adicionar ao plano</button>`:''}</div>`).join('')}</div>`;
}

  const rows=[];d.dimensoes.forEach(m=>m.grupos.forEach(g=>rows.push({m,g})));rows.sort((a,b)=>b.g.score-a.g.score);
  const dn=c=>(d.dimensoes.find(x=>x.codigo===c)||{}).nome||'Geral';
  $('#view').innerHTML=`<div class="noprint row"><button class="btn line" onclick="drawRes()">← Voltar</button><button class="btn gold" onclick="window.print()">Imprimir / Salvar PDF</button></div>

  <p><b>Empresa:</b> ${esc(c.nr1_empresas?.nome||'')}<br><b>Avaliação:</b> ${esc(c.nome)}<br><b>Emissão:</b> ${new Date().toLocaleDateString('pt-BR')}<br><b>Respostas válidas:</b> ${d.total}</p>
  <h2>1. Objetivo e enquadramento</h2><p>Identificar e avaliar, de forma coletiva, fatores de risco psicossociais relacionados à organização do trabalho, como subsídio ao gerenciamento de riscos ocupacionais (GRO/PGR – NR-1) e à avaliação ergonômica (NR-17), conforme as orientações do Ministério do Trabalho e Emprego.</p>
  <h2>2. Método</h2><p>Questionário anônimo e voluntário, com ${d.dimensoes.length} fatores de risco e ${nItens} afirmações por fator (listadas no Anexo A), respondidas em escala de concordância de 5 pontos (com opção “não se aplica”). Cada resposta é convertida em exposição (itens de proteção são invertidos); o fator de cada respondente é a média de seus itens. Considera-se exposto quem atinge média igual ou superior a 3,5. A <b>probabilidade</b> (1 a 4) decorre da proporção de expostos no grupo (&lt;15% = 1; 15–29% = 2; 30–49% = 3; ≥50% = 4). A <b>severidade</b> (1 a 4) é definida por fator e pode ser ajustada pelo responsável técnico. O <b>nível de risco</b> resulta do produto probabilidade × severidade: Baixo (1–3), Moderado (4–6), Alto (8–9) e Crítico (12–16).</p>
  <p><b>Proteção do anonimato:</b> não foram coletados dados identificáveis e grupos com menos de ${d.min_grupo} respostas não são apresentados.</p>
  <h2>3. Inventário dos fatores avaliados</h2>
  <div class="scroll"><table><thead><tr><th>Fator</th><th>Grupo</th><th>Respostas</th><th>% expostos</th><th>Prob.</th><th>Sev.</th><th>Escore</th><th>Nível</th></tr></thead><tbody>
  ${rows.map(({m,g})=>`<tr><td>${esc(m.nome)}</td><td>${esc(nome(g.setor_id))}</td><td>${g.n}</td><td>${g.pct}%</td><td>${g.prob}</td><td>${m.severidade}</td><td>${g.score}</td><td>${lvBadge(g.nivel)}</td></tr>`).join('')}</tbody></table></div>
  ${d.dimensoes.some(m=>m.medidas_existentes||m.observacao)?`<h2>4. Medidas existentes e observações técnicas</h2>${d.dimensoes.filter(m=>m.medidas_existentes||m.observacao).map(m=>`<p><b>${esc(m.nome)}</b><br>${m.medidas_existentes?'Medidas existentes: '+esc(m.medidas_existentes)+'<br>':''}${m.observacao?'Observações: '+esc(m.observacao):''}</p>`).join('')}`:''}
  <h2>5. Plano de ação</h2>${RES.plano.length?`<table><thead><tr><th>Fator</th><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr></thead><tbody>${RES.plano.map(p=>`<tr><td>${esc(dn(p.dimensao))}</td><td>${esc(p.acao)}</td><td>${esc(p.responsavel||'')}</td><td>${p.prazo?new Date(p.prazo+'T12:00').toLocaleDateString('pt-BR'):''}</td><td>${esc(p.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">A definir.</p>'}
  <h2>6. Limitações</h2><p>Este relatório trata de condições de organização do trabalho em nível coletivo. Não constitui diagnóstico clínico individual. Os resultados devem ser analisados por profissional habilitado, considerados em conjunto com outras fontes (observação do trabalho, entrevistas, indicadores de afastamento, canais de denúncia) e integrados ao inventário de riscos do PGR da empresa. O acompanhamento deve ser contínuo, com reavaliação periódica.</p>
  <p><b>Sobre o instrumento:</b> as afirmações são originais, elaboradas a partir dos constructos descritos na literatura científica e nas diretrizes citadas (seção 7). O questionário não é uma versão validada psicometricamente de nenhum dos instrumentos mencionados; recomenda-se verificar sua consistência interna com os dados coletados e revisar o conjunto de itens periodicamente. A avaliação não mede sintomas nem estresse individual: foca as condições de organização do trabalho, conforme orientação do MTE.</p>
  <h2>7. Referências</h2>
  <ul>${DM.filter(x=>x.referencias).map(x=>`<li><b>${esc((d.dimensoes.find(m=>m.codigo===x.codigo)||{}).nome||x.codigo)}:</b> ${esc(x.referencias)}</li>`).join('')}
  <li><b>Normas e orientações:</b> NR-1 (capítulo 1.5, GRO/PGR), Portaria MTE nº 1.419/2024; NR-17 (avaliação ergonômica preliminar); Guia de Informações sobre os Fatores de Riscos Psicossociais Relacionados ao Trabalho (MTE, 2025); Manual do GRO/PGR (MTE, 2026); ISO 45003:2021.</li></ul>
  <h2>Anexo A – Afirmações do questionário</h2>
  ${d.dimensoes.map(m=>`<p style="margin:10px 0 2px"><b>${esc(m.nome)}</b></p><ol style="margin:0 0 4px 18px">${PQ.filter(x=>x.dimensao===m.codigo).map(x=>`<li>${esc(x.texto)}${x.sentido==='protecao'?' <span class="muted">(item de proteção, pontuação invertida)</span>':''}</li>`).join('')}</ol>`).join('')}
  <div class="sign"><div>Responsável técnico (nome e registro profissional)</div><div>Representante da empresa</div></div></div>`;
  window.scrollTo(0,0);
}

/* ============ PROGRAMAS (instituto) ============ */
let TR=[];
VIEWS.programas=async()=>{
  const [tr,emp,lib]=await Promise.all([q(sb.from('nr1_trilhas').select('*, nr1_modulos(id,titulo,ordem, nr1_aulas(id,titulo,tipo,ordem))').order('ordem')),q(sb.from('nr1_empresas').select('id,nome').order('nome')),q(sb.from('nr1_empresa_trilhas').select('*'))]);
  TR=tr;const has=(e,t)=>lib.some(l=>l.empresa_id===e&&l.trilha_id===t);
  $('#view').innerHTML=`<h1>Programas contínuos</h1>
  <details class="card"><summary>+ Nova trilha</summary><div class="grid" style="margin-top:10px"><div><label>Título</label><input id="t-tit"></div>
   <div><label>Público</label><select id="t-pub"><option value="colaboradores">Colaboradores</option><option value="lideranca">Lideranças</option><option value="rh">RH e gestão</option></select></div>
   <div><label>Formato</label><select id="t-cat"><option value="curso">Curso</option><option value="servico">Serviço com psicólogo(a)</option></select></div>
   <div><label>Ordem</label><input id="t-ord" type="number" value="${tr.length+1}"></div></div><label style="margin-top:8px">Descrição</label><textarea id="t-desc"></textarea><p><button class="btn" onclick="addTrilha()">Criar trilha</button></p></details>
  ${tr.map(t=>`<div class="card"><div class="row"><h3>${esc(t.titulo)}</h3>${chips(t)}</div><p class="muted">${esc(t.descricao||'')}</p>
   <label>Liberada para as empresas</label><div>${emp.map(e=>`<label style="display:inline-flex;gap:6px;margin-right:14px;color:var(--ink)"><input type="checkbox" style="width:auto" ${has(e.id,t.id)?'checked':''} onchange="toggleLib('${t.id}','${e.id}',this.checked)">${esc(e.nome)}</label>`).join('')||'<span class="muted">Cadastre uma empresa.</span>'}</div>
   <div style="margin-top:12px">${(t.nr1_modulos||[]).sort((a,b)=>a.ordem-b.ordem).map(m=>`<p style="margin:8px 0 2px"><b>${esc(m.titulo)}</b></p>${(m.nr1_aulas||[]).sort((a,b)=>a.ordem-b.ordem).map(a=>`<div class="row" style="padding:3px 0"><span>${esc(a.titulo)} <span class="muted">· ${a.tipo}</span></span><button class="btn sm line" onclick="delAula('${a.id}')">Excluir</button></div>`).join('')}`).join('')}</div>
   <details style="margin-top:10px"><summary>+ Nova aula</summary><div class="grid" style="margin-top:10px">
    <div><label>Módulo (existente ou novo)</label><input id="a-mod-${t.id}" list="ml-${t.id}" placeholder="Módulo 1"><datalist id="ml-${t.id}">${(t.nr1_modulos||[]).map(m=>`<option value="${esc(m.titulo)}">`).join('')}</datalist></div>
    <div><label>Título da aula</label><input id="a-tit-${t.id}"></div>
    <div><label>Tipo</label><select id="a-tipo-${t.id}"><option value="texto">Texto</option><option value="video">Vídeo</option><option value="pdf">PDF</option><option value="pratica">Prática</option></select></div>
    <div><label>Link de vídeo/PDF (opcional)</label><input id="a-url-${t.id}" placeholder="https://youtu.be/…"></div>
    <div><label>Duração (min)</label><input id="a-dur-${t.id}" type="number" min="1"></div></div>
    <label style="margin-top:8px">Conteúdo da aula</label><textarea id="a-cont-${t.id}" style="min-height:140px"></textarea><p><button class="btn" onclick="addAula('${t.id}')">Adicionar aula</button></p></details></div>`).join('')}`;
};
async function addTrilha(){const t=$('#t-tit').value.trim();if(!t)return;await q(sb.from('nr1_trilhas').insert({titulo:t,publico:$('#t-pub').value,categoria:$('#t-cat').value,ordem:+$('#t-ord').value||0,descricao:$('#t-desc').value||null}));draw()}
async function toggleLib(t,e,on){on?await q(sb.from('nr1_empresa_trilhas').upsert({empresa_id:e,trilha_id:t})):await q(sb.from('nr1_empresa_trilhas').delete().eq('empresa_id',e).eq('trilha_id',t));toast(on?'Trilha liberada':'Trilha removida da empresa')}
async function addAula(tid){
  const t=TR.find(x=>x.id===tid),mt=$('#a-mod-'+tid).value.trim()||'Módulo 1',tit=$('#a-tit-'+tid).value.trim();if(!tit)return toast('Informe o título da aula',true);
  let m=(t.nr1_modulos||[]).find(x=>x.titulo===mt);
  if(!m)m=await q(sb.from('nr1_modulos').insert({trilha_id:tid,titulo:mt,ordem:(t.nr1_modulos||[]).length+1}).select().single());
  const n=((m.nr1_aulas)||[]).length+1;
  await q(sb.from('nr1_aulas').insert({modulo_id:m.id,titulo:tit,tipo:$('#a-tipo-'+tid).value,video_url:$('#a-url-'+tid).value||null,duracao_min:+$('#a-dur-'+tid).value||null,conteudo:$('#a-cont-'+tid).value||null,ordem:n}));
  toast('Aula adicionada');draw();
}
async function delAula(id){if(!confirm('Excluir esta aula?'))return;await q(sb.from('nr1_aulas').delete().eq('id',id));draw()}

/* ============ EQUIPE (gestor) ============ */
VIEWS.equipe=async()=>{
  const [emp,perf,prog,tr]=await Promise.all([q(sb.from('nr1_empresas').select('nome,codigo_acesso')),q(sb.from('nr1_perfis').select('user_id,nome,email,papel')),q(sb.from('nr1_progresso').select('user_id,aula_id')),q(sb.from('nr1_trilhas').select('id,nr1_modulos(nr1_aulas(id))'))]);
  const total=tr.reduce((s,t)=>s+(t.nr1_modulos||[]).reduce((a,m)=>a+(m.nr1_aulas||[]).length,0),0);
  $('#view').innerHTML=`<h1>Equipe e progresso</h1><div class="card"><p>${emp[0]?`Para convidar colaboradores à plataforma de ensino, peça que criem uma conta e informem o código <span class="code">${esc(emp[0].codigo_acesso)}</span> no primeiro acesso.`:''}</p></div>
  <div class="card scroll"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Aulas concluídas</th><th>Progresso</th></tr></thead><tbody>
  ${perf.filter(p=>p.papel==='aluno').map(p=>{const n=prog.filter(x=>x.user_id===p.user_id).length,pc=total?Math.round(n/total*100):0;return `<tr><td>${esc(p.nome||'')}</td><td>${esc(p.email||'')}</td><td>${n}/${total}</td><td style="min-width:140px"><div class="prog"><i style="width:${pc}%"></i></div> ${pc}%</td></tr>`}).join('')||'<tr><td colspan="4" class="muted">Nenhum aluno cadastrado ainda.</td></tr>'}</tbody></table></div>`;
};

/* ============ PLATAFORMA DE ENSINO ============ */
const PL={done:new Set(),flat:[],trilha:null};
VIEWS.plataforma=async()=>{await plLista()};
async function plLista(){
  const [tr,prog]=await Promise.all([q(sb.from('nr1_trilhas').select('*, nr1_modulos(id, nr1_aulas(id))').eq('ativo',true).order('ordem')),q(sb.from('nr1_progresso').select('aula_id').eq('user_id',USER.id))]);
  PL.done=new Set(prog.map(p=>p.aula_id));
  $('#view').innerHTML=`<h1>Programas de desenvolvimento</h1>${tr.length?'':'<div class="card"><p class="muted">Nenhum programa liberado para a sua empresa ainda.</p></div>'}
  <div class="grid" style="align-items:stretch">${tr.map(t=>{const ids=(t.nr1_modulos||[]).flatMap(m=>(m.nr1_aulas||[]).map(a=>a.id)),n=ids.filter(i=>PL.done.has(i)).length,pc=ids.length?Math.round(n/ids.length*100):0;
   return `<div class="card pcard" onclick="plTrilha('${t.id}')">${chips(t)}<h3>${esc(t.titulo)}</h3><p class="muted">${esc(t.descricao||'')}</p><div class="prog"><i style="width:${pc}%"></i></div><small class="muted">${n}/${ids.length} aulas · ${pc}%</small></div>`}).join('')}</div>`;
}
async function plTrilha(id){
  const t=await q(sb.from('nr1_trilhas').select('*, nr1_modulos(id,titulo,ordem,nr1_aulas(id,titulo,tipo,duracao_min,ordem))').eq('id',id).single());
  const mods=(t.nr1_modulos||[]).sort((a,b)=>a.ordem-b.ordem);mods.forEach(m=>m.nr1_aulas.sort((a,b)=>a.ordem-b.ordem));
  PL.trilha=t;PL.flat=mods.flatMap(m=>m.nr1_aulas);
  $('#view').innerHTML=`<button class="btn line sm" onclick="plLista()">← Programas</button><h1 style="margin-top:10px">${esc(t.titulo)}</h1><p class="muted">${esc(t.descricao||'')}</p>
  ${mods.map(m=>`<div class="card"><h3>${esc(m.titulo)}</h3>${m.nr1_aulas.map(a=>`<div class="aula" onclick="plAula('${a.id}')"><span class="ck ${PL.done.has(a.id)?'on':''}">${PL.done.has(a.id)?'✓':''}</span><span>${esc(a.titulo)}</span><span class="muted" style="margin-left:auto">${a.duracao_min?a.duracao_min+' min':''}</span></div>`).join('')}</div>`).join('')}`;
}
function ytEmbed(u){const m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);return m?`https://www.youtube-nocookie.com/embed/${m[1]}`:null}
async function plAula(id){
  const a=await q(sb.from('nr1_aulas').select('*').eq('id',id).single());
  const i=PL.flat.findIndex(x=>x.id===id),nx=PL.flat[i+1],emb=ytEmbed(a.video_url),done=PL.done.has(id);
  $('#view').innerHTML=`<button class="btn line sm" onclick="plTrilha('${PL.trilha.id}')">← ${esc(PL.trilha.titulo)}</button>
  <div class="card narrow" style="margin-top:12px;max-width:760px"><h2>${esc(a.titulo)}</h2>
  ${emb?`<div class="video"><iframe src="${emb}" allowfullscreen loading="lazy"></iframe></div>`:(a.video_url&&/^https?:\/\//.test(a.video_url)?`<p><a href="${esc(a.video_url)}" target="_blank" rel="noopener">Abrir material ↗</a></p>`:'')}
  <div class="lesson">${esc(a.conteudo||'')}</div>
  <div class="row" style="margin-top:20px"><button class="btn ${done?'line':'gold'}" id="btn-done" onclick="toggleDone('${id}')">${done?'✓ Concluída (desmarcar)':'Marcar como concluída'}</button>${nx?`<button class="btn" onclick="plAula('${nx.id}')">Próxima aula →</button>`:''}</div></div>`;
  window.scrollTo(0,0);
}
async function toggleDone(id){
  if(PL.done.has(id)){await q(sb.from('nr1_progresso').delete().eq('user_id',USER.id).eq('aula_id',id));PL.done.delete(id)}
  else{await q(sb.from('nr1_progresso').upsert({user_id:USER.id,aula_id:id}));PL.done.add(id)}
  const d=PL.done.has(id),b=$('#btn-done');b.className='btn '+(d?'line':'gold');b.textContent=d?'✓ Concluída (desmarcar)':'Marcar como concluída';
}

/* ============ USUÁRIOS (instituto) ============ */
VIEWS.usuarios=async()=>{
  const [perf,emp]=await Promise.all([q(sb.from('nr1_perfis').select('*').order('criado_em',{ascending:false})),q(sb.from('nr1_empresas').select('id,nome').order('nome'))]);
  $('#view').innerHTML=`<h1>Usuários</h1><div class="card scroll"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Empresa</th></tr></thead><tbody>
  ${perf.map(p=>`<tr><td>${esc(p.nome||'')}</td><td>${esc(p.email||'')}</td>
  <td><select onchange="updPerfil('${p.user_id}','papel',this.value)">${Object.entries(PAPEL).map(([k,v])=>`<option value="${k}" ${k===p.papel?'selected':''}>${v}</option>`).join('')}</select></td>
  <td><select onchange="updPerfil('${p.user_id}','empresa_id',this.value)"><option value="">—</option>${emp.map(e=>`<option value="${e.id}" ${e.id===p.empresa_id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
  <p class="muted">Defina o papel “Gestor da empresa” para quem deve ver os resultados e o plano de ação da própria empresa.</p>`;
};
async function updPerfil(uid,f,v){await q(sb.from('nr1_perfis').update({[f]:v||null}).eq('user_id',uid));toast('Atualizado')}

/* ============ INÍCIO ============ */
const _c=new URLSearchParams(location.search).get('c');
_c?startRespondent(_c):startAuth();
</script>
